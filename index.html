<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>Rock, Paper, Scissors</h1>
    <div class="bar"></div>
    <div class="main">
        <div class="main-body">
        <div class="main-top">
            <h2>Score</h2>
            <p id="scoredisplay">Your points: 0 | Computer points: 0</p>
            
        </div>
        <div class="imgbox">
            <div class="wrapper">
            <button class="select" id="rock">Rock</button>
            <img src=".\rock-svgrepo-com.svg" alt="A two-toned graphic of a rock">
            </div>

            <div class="wrapper">
            <button class="select" id="paper">Paper</button>
            <img src=".\paper-plane-svgrepo-com.svg" alt="A graphic of a paper plane">
            </div>
            
            <div class="wrapper">
            <button class="select" id="scissors">Scissors</button>
            <img src=".\scissors-svgrepo-com.svg" alt="A graphic of teal scissors.">
            </div>
            <!-- svgrepo.com -->
        </div>
        </div>
        <div class="sidebar">
            <h3>Log:</h3>
        <ol id="outcomelist">
        </ol>
        </div>
    </div>
    <div class="bar"></div>
</body>
<footer>
</footer>
    <script>
        let humanScore = 0;
        let computerScore = 0;
        let list = document.querySelector("#outcomelist")
        
        function playGame() {
        const computerSelection = getComputerChoice();
        console.log(`   Computer: ${computerSelection}.`);
        const humanSelection = getHumanChoice();
        console.log(`   Player: ${humanSelection}.`);

        if (humanScore == 5 || computerScore == 5) {
            clearLog()
            humanScore = 0
            computerScore = 0
        }
        
        function getComputerChoice() {
            randomNumber = ((Math.random() * 100));
            // console.log(`This determines what the computer selects: ${randomNumber}`)
            if (randomNumber < 33.333) {
                computerChoice = "Rock";
            }
            else if (randomNumber >= 33.333 && randomNumber < 66.666) {
                computerChoice = "Paper";
            }
            else { computerChoice = "Scissors"; }
            return computerChoice;
        }

        function getHumanChoice() {
            if (playerinput === "rock") {
                humanChoice = "Rock";
            }
            else if (playerinput === "paper") {
                humanChoice = "Paper";
            }
            else if (playerinput === "scissors") {
                humanChoice = "Scissors";
            }
            return humanChoice;
        }

        function playRound(humanSelection, computerSelection) {
            let playerwin = (`* ${humanChoice} beats ${computerChoice}. You win! *`);
            let compwin = (`- ${computerChoice} beats ${humanChoice}. You lost! -`);
            let tie = (`~ ${humanChoice} and ${computerChoice}. You tied! ~`);
            
            if ((humanChoice == "Rock" && computerChoice == "Scissors") || (humanChoice == "Paper" && computerChoice == "Rock") || (humanChoice == "Scissors" && computerChoice == "Paper")) {
                humanScore++;
                if (humanScore == 5) {
                    return playerwin;
                }
                return playerwin;
            }
            else if (humanChoice == computerChoice) {
                return tie
            }
            else {
                computerScore++;
                if (computerScore == 5) {
                    return compwin;
                }
                return compwin
            }

        }
        function clearLog() {
            listAll = document.querySelectorAll(".round")
            listAll.forEach((item) => item.remove())
        }

        roundResult = playRound()
        const listItem = document.createElement("li");
        listItem.classList.toggle("round")
        listItem.textContent = roundResult;
        list.appendChild(listItem);
        console.log(roundResult)
        console.log(`Your points: ${humanScore} | Computer points: ${computerScore}`)
        let scoreText = document.querySelector("#scoredisplay");
        scoreText.textContent = `Your points: ${humanScore} | Computer points: ${computerScore}`

        finalResult()
        }

        playerRock = document.querySelector("#rock")
        playerPaper = document.querySelector("#paper")
        playerScissors = document.querySelector("#scissors")

        playerRock.addEventListener("click", () => {
            playerinput = "rock"
            playGame()
        })
        playerPaper.addEventListener("click", () => {
            playerinput = "paper"
            playGame()
        })
        playerScissors.addEventListener("click", () => {
            playerinput = "scissors"
            playGame()
        })
    
    const resultText = document.createElement("p");
    resultText.classList.toggle("round");

    function finalResult() {
        if (humanScore == 5) {
        resultText.textContent = "**Player wins the game!**"
        resultText.setAttribute("id", "win")
        list.appendChild(resultText)
        }

        if (computerScore == 5) {
        resultText.textContent = "--Computer wins the game!--"
        resultText.setAttribute("id", "loss")
        list.appendChild(resultText)
        }
    }

    </script>
</html>
